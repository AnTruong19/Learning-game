<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Whisker Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a graph-paper desk. One sticker-outlined card carries the current task; everything else sits flat on the paper. */
:root {
  --bg: #E6EFF6; --grid: #D2E0EC; --surface: #FFFFFF; --surface2: #F0F6FB;
  --ink: #1B2845; --muted: #53637F; --line: #1B2845; --soft: #C9D6E4; --shadow: #1B2845;
  --yarn: #D93A5E; --yarn-ink: #FFFFFF; --teal: #0B8577; --sun: #FFC93C; --sun-ink: #3F2D00;
  --good: #14794A; --good-bg: #DDF5E7; --bad: #B93030; --bad-bg: #FBE3E1; --stage: #CFE4F2;
  --sil: brightness(0); --sil-o: .22;
  --f-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101728; --grid: #172036; --surface: #1B2540; --surface2: #232F4F;
    --ink: #EAF0FB; --muted: #A6B5D0; --line: #5A6C96; --soft: #33416A; --shadow: #060A13;
    --yarn: #F0557A; --yarn-ink: #FFFFFF; --teal: #3CCFBD; --sun: #FFD45E; --sun-ink: #3F2D00;
    --good: #4AD18F; --good-bg: #143A2A; --bad: #FF8A80; --bad-bg: #43201F; --stage: #24345C;
    --sil: brightness(0) invert(1); --sil-o: .2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101728; --grid: #172036; --surface: #1B2540; --surface2: #232F4F;
  --ink: #EAF0FB; --muted: #A6B5D0; --line: #5A6C96; --soft: #33416A; --shadow: #060A13;
  --yarn: #F0557A; --yarn-ink: #FFFFFF; --teal: #3CCFBD; --sun: #FFD45E; --sun-ink: #3F2D00;
  --good: #4AD18F; --good-bg: #143A2A; --bad: #FF8A80; --bad-bg: #43201F; --stage: #24345C;
  --sil: brightness(0) invert(1); --sil-o: .2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 48px; min-height: 100%;
}
#app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-family: var(--f-display); font-size: .78rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1 1 0; min-width: 0; }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; letter-spacing: -.01em; }
.brand svg { width: 34px; height: 34px; flex: none; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.pill svg { width: 18px; height: 18px; }
.pill.fish { background: var(--sun); color: var(--sun-ink); border-color: var(--shadow); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; flex: none; }
nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { flex: 1 1 0; min-width: 62px; padding: 9px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 600; cursor: pointer; text-align: center; }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; padding: .62em 1.15em; border-radius: 13px; border: 2px solid var(--shadow); background: var(--yarn); color: var(--yarn-ink); box-shadow: 0 4px 0 var(--shadow); cursor: pointer; transition: transform .06s, box-shadow .06s; text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn.alt { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn.big { font-size: 1.15rem; padding: .7em 1.5em; }
.btn.sm { font-size: .9rem; padding: .4em .7em; white-space: nowrap; box-shadow: 0 3px 0 var(--shadow); border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .92rem; }

/* cards */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; box-shadow: 5px 5px 0 var(--shadow); padding: 20px; }
.panel { background: var(--surface); border: 1.5px solid var(--soft); border-radius: 14px; padding: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; align-items: start; }

/* cat */
.cat { display: block; width: 100%; height: auto; max-width: 100%; overflow: visible; }
.cat.sil { filter: var(--sil); opacity: var(--sil-o); }
.stage { background: var(--stage); border-radius: 16px; padding: 10px 10px 0; position: relative; border: 1.5px solid var(--soft); overflow: hidden; }
.stage::after { content: ''; display: block; height: 10px; background: var(--soft); margin: 0 -10px; }
.buddy { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 16px; align-items: center; }
.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; position: relative; }
.bubble::before { content: ''; position: absolute; left: -9px; top: 26px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
@media (max-width: 520px) { .buddy { grid-template-columns: 1fr; } .buddy .stage { max-width: 190px; margin: 0 auto; } .bubble::before { display: none; } }
.bar { height: 12px; border-radius: 999px; background: var(--surface2); border: 1.5px solid var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 0 4px 4px 0; }
.bar.sun > i { background: var(--sun); }

/* year map */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.unit { border: 1.5px solid var(--soft); border-radius: 12px; padding: 8px 10px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.unit.now { border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); }
.unit b { font-family: var(--f-display); font-weight: 600; font-size: .92rem; line-height: 1.2; }
.unit span { font-size: .8rem; color: var(--muted); line-height: 1.25; }
.dots { display: flex; gap: 4px; margin-top: 2px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface2); border: 1px solid var(--soft); }
.dots i.d { background: var(--teal); border-color: var(--teal); }
.dots i.h { background: var(--sun); border-color: var(--sun); }

/* mission */
.mhead { display: flex; align-items: center; gap: 12px; }
.steps { display: flex; gap: 4px; flex: 1; }
.steps i { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); border: 1.5px solid var(--soft); }
.steps i.ok { background: var(--good); border-color: var(--good); }
.steps i.no { background: var(--bad); border-color: var(--bad); }
.steps i.cur { border-color: var(--line); background: var(--sun); }
.qwrap { display: grid; grid-template-columns: 1fr 150px; gap: 18px; align-items: start; }
.qwrap .side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
@media (max-width: 640px) { .qwrap { grid-template-columns: 1fr; } .qwrap .side { display: none; } }
.qtext { font-size: 1.4rem; line-height: 1.45; font-weight: 700; overflow-wrap: anywhere; }
.qtext.long { font-size: 1.14rem; font-weight: 400; }
.tag { display: inline-block; font-family: var(--f-display); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface2); }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.1; margin: 0 .12em; }
.fr b { font-weight: inherit; padding: 0 .2em; }
.fr b + b { border-top: 2px solid currentColor; }
.eqn { font-size: 1.1em; white-space: nowrap; }
table.xy { border-collapse: collapse; margin: 10px 0; font-size: 1rem; font-weight: 400; }
table.xy td, table.xy th { border: 1.5px solid var(--soft); padding: 4px 12px; text-align: center; font-variant-numeric: tabular-nums; }
table.xy th { background: var(--surface2); font-family: var(--f-display); font-weight: 600; }
.tscroll { overflow-x: auto; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border-radius: 13px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.05rem; min-width: 0; box-shadow: 0 3px 0 var(--shadow); }
.choice:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.choice > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--surface2); border: 1.5px solid var(--soft); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: .85rem; }
.choice.ok { background: var(--good-bg); border-color: var(--good); }
.choice.no { background: var(--bad-bg); border-color: var(--bad); }
.choice:disabled { cursor: default; box-shadow: none; }
.choice:disabled:not(.ok):not(.no) { opacity: .55; }
.ansrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 1.25rem; font-weight: 700; }
.ansrow input { width: 170px; max-width: 100%; font-size: 1.4rem; font-weight: 700; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface2); font-variant-numeric: tabular-nums; }
.ansrow input.shake { animation: shake .3s; border-color: var(--bad); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 320px; }
.key { padding: 10px 0; border-radius: 11px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; cursor: pointer; box-shadow: 0 3px 0 var(--shadow); }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.key.go { grid-column: span 2; background: var(--yarn); color: var(--yarn-ink); border-color: var(--shadow); }
.fb { border-radius: 14px; padding: 14px 16px; border: 2px solid; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--good-bg); border-color: var(--good); }
.fb.no { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fb .ex { font-size: 1rem; line-height: 1.6; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.pop { animation: pop .35s; }

/* games */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.game { display: flex; flex-direction: column; gap: 8px; }
.game .art { height: 74px; border-radius: 12px; background: var(--stage); display: grid; place-items: center; border: 1.5px solid var(--soft); }
.game .art svg { width: 56px; height: 56px; }
.game .btn { margin-top: auto; }
.timer { height: 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); overflow: hidden; }
.timer > i { display: block; height: 100%; background: var(--yarn); transition: width .1s linear; }
.dashq { font-family: var(--f-display); font-size: 2.3rem; font-weight: 600; text-align: center; padding: 10px 0; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 620px) { .mem { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
.mcard { min-height: 104px; border-radius: 13px; border: 2px solid var(--line); background: var(--teal); color: var(--ink); cursor: pointer; padding: 8px; display: grid; place-items: center; text-align: center; font-size: .84rem; line-height: 1.25; box-shadow: 0 3px 0 var(--shadow); overflow-wrap: anywhere; min-width: 0; }
.mcard svg { width: 30px; height: 30px; opacity: .9; }
.mcard.up { background: var(--surface); }
.mcard.term { font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
.mcard.done { background: var(--good-bg); border-color: var(--good); box-shadow: none; cursor: default; }
.boxes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.box { min-width: 96px; padding: 16px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--sun); color: var(--sun-ink); font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 0 var(--shadow); position: relative; }
.box.done { background: var(--good-bg); color: var(--ink); border-color: var(--good); box-shadow: none; cursor: default; }
.box.done::after { content: attr(data-n); position: absolute; top: -10px; right: -8px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: var(--surface); font-size: .8rem; display: grid; place-items: center; }
.box.shake { animation: shake .3s; background: var(--bad-bg); color: var(--ink); }
.sortitem { font-family: var(--f-display); font-size: 1.8rem; font-weight: 600; text-align: center; padding: 22px 12px; border-radius: 14px; background: var(--surface2); border: 1.5px dashed var(--line); }
.buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.buckets .btn { padding: 1em .6em; }

/* cats collection */
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.ccard { background: var(--surface); border: 1.5px solid var(--soft); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; cursor: default; }
button.ccard { cursor: pointer; }
.ccard.sel { border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); }
.ccard .stage { padding: 6px 14px 0; }
.ccard b { font-family: var(--f-display); font-weight: 600; }
.ccard .btn { margin-top: auto; }
.legend-tag { color: var(--sun-ink); background: var(--sun); border-radius: 999px; font-size: .72rem; font-family: var(--f-display); font-weight: 600; padding: 1px 8px; align-self: center; letter-spacing: .05em; text-transform: uppercase; }
.detail { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 20px; align-items: start; }
@media (max-width: 600px) { .detail { grid-template-columns: 1fr; } .detail > .stage { max-width: 220px; margin: 0 auto; width: 100%; } }
.foods { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.food { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; box-shadow: 0 3px 0 var(--shadow); }
.food:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.food:disabled { opacity: .45; cursor: not-allowed; }
.food b { font-family: var(--f-display); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
input.text, select.text { padding: 8px 12px; border-radius: 11px; border: 2px solid var(--line); background: var(--surface2); min-width: 0; max-width: 100%; }

/* progress */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1.5px solid var(--soft); border-radius: 14px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--f-display); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.meter { display: grid; grid-template-columns: 110px 1fr 104px; gap: 10px; align-items: center; font-size: .95rem; }
.meter .v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 460px) { .meter { grid-template-columns: 88px 1fr 92px; font-size: .85rem; } }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 360px; }
.cal i { aspect-ratio: 1; border-radius: 8px; background: var(--surface2); border: 1.5px solid var(--soft); display: grid; place-items: center; font-style: normal; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal i.on { background: var(--teal); border-color: var(--teal); color: var(--surface); font-weight: 700; }
.cal i.today { border-color: var(--line); border-width: 2px; }
.cal .dow { background: none; border: 0; aspect-ratio: auto; font-family: var(--f-display); }
table.sk { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.sk th { text-align: left; font-family: var(--f-display); font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1.5px solid var(--soft); }
table.sk td { padding: 7px 8px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
table.sk td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--soft); white-space: nowrap; }
.status.good { border-color: var(--good); color: var(--good); }
.status.bad { border-color: var(--bad); color: var(--bad); }

.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-family: var(--f-display); font-weight: 600; z-index: 20; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.confirm { border: 2px solid var(--bad); background: var(--bad-bg); border-radius: 12px; padding: 12px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.room { display: block; width: 100%; height: auto; border: 2px solid var(--line); border-radius: 18px; box-shadow: 5px 5px 0 var(--shadow); background: #CFE6F5; }
.rcat { cursor: pointer; }
.rcat:hover, .rcat:focus-visible { filter: drop-shadow(0 0 6px rgba(255, 201, 60, .95)); outline: none; }
.ipv { display: block; width: 100%; height: 100px; background: var(--stage); border-radius: 10px; border: 1.5px solid var(--soft); }
@media (max-width: 480px) { .tab { font-size: .8rem; padding: 8px 2px; white-space: nowrap; } nav.tabs { gap: 5px; } }

.rbody { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }

.room3d { position: relative; width: 100%; aspect-ratio: 16 / 10; border: 2px solid var(--line); border-radius: 18px; box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; background: #DCE9F3; }
.room3d canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.r3tip { position: absolute; transform: translateX(-50%); background: #1B2845; color: #fff; padding: 3px 10px; border-radius: 999px; font-family: var(--f-display); font-weight: 600; font-size: .9rem; pointer-events: none; white-space: nowrap; }
.r3hint { position: absolute; right: 10px; bottom: 8px; font-size: .78rem; background: rgba(255, 255, 255, .8); color: #1B2845; padding: 2px 9px; border-radius: 999px; pointer-events: none; }
@media (max-width: 600px) { .room3d { aspect-ratio: 4 / 3.4; } }

button.brand { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; border-radius: 10px; }
button.brand:hover span { text-decoration: underline; text-underline-offset: 4px; }

/* ---------- phones ---------- */
.tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tab svg { width: 18px; height: 18px; flex: none; }
@media (max-width: 640px) {
  body { padding-block: 12px calc(92px + env(safe-area-inset-bottom, 0px)); }
  #app { gap: 14px; }

  let s = '';
  for (let r = 0; r < 7; r++) for (let c = 0; c < 18; c++) {
    const on = r === 0 ? (c === 0 || c === 17) : r < 3 ? (c < 2 || c > 11) : true;
    if (!on) continue;
    const col = c < 2 ? '#F28B82' : c > 11 ? (c === 17 ? '#C7B3F2' : '#9FD8C9') : '#FFD27A';
    s += `<rect x="${252 + c * 6.6}" y="${120 + r * 13}" width="5.6" height="11" fill="${col}"/>`;
  }
  return s;
}

  /* ---------- missions ---------- */

        : `<div class="fb no"><h3>${IC.cross} Not quite. The answer is ${q.as}${q.kind === 'num' && q.u && q.u !== '$' ? ' ' + q.u : ''}</h3>${q.ex ? `<div class="ex">${q.ex}</div>` : ''}${q.retry ? '' : '<p class="small muted">You will get one more like this at the end.</p>'}<div><button class="btn" data-a="next" id="nextbtn">${M.i === M.qs.length - 1 && !M.retry.length ? 'Finish' : 'Next'}</button></div></div>`;
    }
    const long = strip(q.t).length > 70 || q.t.includes('<table');
    return `<div class="mhead">${UI.quitAsk ? `<span class="small">Quit? This mission will not count.</span><button class="btn alt sm" data-a="quit-yes">Quit</button><button class="btn alt sm" data-a="quit-no">Keep going</button>` : `<button class="link" data-a="quit">Quit</button>`}<div class="steps" aria-label="Question ${M.i + 1} of ${M.qs.length}">${steps}</div><span class="pill fish small">${IC.fish}<span class="num">${M.earned}</span></span></div>
      <section class="card qwrap"><div class="stack" style="gap:16px">
        <div class="row" style="gap:8px"><span class="tag">${AREA[q.sub]}</span><span class="muted small">${q.label}${q.retry ? ' · second try' : ''}</span></div>
        <div class="qtext ${long ? 'long' : ''}"><div class="tscroll">${q.t}</div></div>${body}${fb}</div>
        <div class="side"><div class="stage" style="width:100%">${catPic(c, { mood: M.done ? (M.ok ? 'happy' : 'sad') : 'ok' })}</div><span class="small muted">${esc(c.name)}</span></div></section>`;

      <h1>${head}</h1><p>You got <b>${d.first} of ${d.n}</b> right on the first try.</p>

      ${d.newCats.length ? `<p>${IC.star} New at the adoption centre: <b>${d.newCats.join(', ')}</b></p>` : ''}

        <span class="small muted">${S.hi[g.id] != null ? `Best: ${S.hi[g.id]} ${g.unit}` : 'Not played yet'} · ${plays[g.id] ? 'reduced fish today' : 'full fish today'}</span>

      return `<div class="mhead">${quit}<div class="timer grow"><i id="tbar" style="width:${GM.t / 60 * 100}%"></i></div><span class="pill small num" id="tsec">${Math.ceil(GM.t)} s</span><span class="pill small">${IC.check}<span class="num">${GM.score}</span></span></div>
        <section class="card stack"><div class="dashq">${GM.q.t}</div><div class="choices">${GM.q.ch.map((c, i) => `<button class="choice ${GM.wrong >= 0 ? (i === GM.q.ci ? 'ok' : i === GM.wrong ? 'no' : '') : ''}" data-a="dash" data-i="${i}" ${GM.wrong >= 0 ? 'disabled' : ''} style="justify-content:center;font-size:1.3rem;font-weight:700">${c}</button>`).join('')}</div></section>`;
    }
    if (GM.id === 'match') {
      return `<div class="mhead">${quit}<span class="grow"></span><span class="pill small">Moves <span class="num">${GM.moves}</span></span><span class="pill small">Pairs <span class="num">${GM.found}/${GM.pairs}</span></span></div>
        <section class="stack"><p class="muted small">Match each word with its meaning.</p><div class="mem">${GM.cards.map((c, i) => `<button class="mcard ${c.done ? 'done up' : c.up ? 'up' : ''} ${c.up || c.done ? (c.type === 't' ? 'term' : '') : ''}" data-a="flip" data-i="${i}" ${c.done ? 'disabled' : ''} aria-label="${c.up || c.done ? esc(c.txt) : 'Hidden card'}">${c.up || c.done ? c.txt : IC.paw}</button>`).join('')}</div></section>`;
    }
    if (GM.id === 'stack') {
      return `<div class="mhead">${quit}<span class="grow"></span><span class="pill small">Round <span class="num">${GM.round + 1}/${GM.rounds}</span></span><span class="pill small">${IC.star}<span class="num">${GM.pts}</span></span></div>
        <section class="card stack center"><h2>Tap from smallest to largest</h2><div class="boxes">${GM.items.map((it, i) => `<button class="box ${it.done ? 'done' : ''} ${GM.shake === i ? 'shake' : ''}" data-a="box" data-i="${i}" data-n="${it.rank + 1}" ${it.done ? 'disabled' : ''}>${it.l}</button>`).join('')}</div><p class="muted small">Convert them in your head to compare. A wrong tap costs points.</p></section>`;
    }

      <section class="card stack"><p class="muted small center">Which group does this belong to?</p><div class="sortitem">${cap(it.t)}</div>
      ${GM.fb ? `<div class="fb ${GM.fb.ok ? 'ok' : 'no'}"><h3>${GM.fb.ok ? IC.check + ' Correct' : IC.cross + ' It belongs to: ' + GM.fb.right}</h3></div>` : `<div class="buckets"><button class="btn sun" data-a="bucket" data-s="a">${st.a}</button><button class="btn sun" data-a="bucket" data-s="b">${st.b}</button></div>`}</section>`;
  }
  function vGameOver() {
    const r = GM.result, c = catById(S.buddy);

  function vCats() {
    const tabs = `<div class="chips" role="tablist">${[['mine', `My cats (${S.cats.length})`], ['adopt', 'Adoption centre'], ['shop', 'Accessories']].map(t => `<button class="chip" role="tab" data-a="ctab" data-t="${t[0]}" aria-pressed="${UI.catsTab === t[0]}">${t[1]}</button>`).join('')}</div>`;

          <div class="row"><button class="btn alt sm" data-a="pet" ${c.pet === td ? 'disabled' : ''}>${IC.heart} ${c.pet === td ? 'Petted today' : 'Pet (free, +5 growth)'}</button>${S.buddy === c.id ? '' : `<button class="btn alt sm" data-a="buddy">Make study buddy</button>`}</div>

          <div class="row"><input class="text" id="rename" maxlength="16" autocomplete="off" value="${esc(c.name)}" aria-label="Cat name" style="width:170px"><button class="btn alt sm" data-a="rename">Rename</button></div>

    } else if (UI.catsTab === 'adopt') {

        const own = owns(b.id), open = isUnlocked(b);
        return `<div class="ccard"><div class="stage">${catSVG(b.id, { stage: own ? 2 : 0, cls: open || own ? '' : 'sil' })}</div><b>${b.name}</b>${b.legend ? '<span class="legend-tag">Legendary</span>' : ''}
          ${own ? `<span class="status good">${IC.check} Adopted</span>` : open ? `<button class="btn sm" data-a="adopt" data-b="${b.id}" ${S.fish < b.cost ? 'disabled' : ''}>Adopt ${b.cost} ${IC.fish}</button>` : `<span class="small muted">${IC.lock} ${needText(b)}</span>`}</div>`;
      }).join('')}</div>`;
    } else {
      const c = catById(S.buddy);
      body = `<p class="muted">Buy an accessory once and any of your cats can wear it.</p><div class="catgrid">${ACCS.map(a => `<div class="ccard"><div class="stage">${catSVG(c.breed, { stage: stageOf(c.lvl), acc: a.id })}</div><b>${a.name}</b>${S.accs.includes(a.id) ? `<span class="status good">${IC.check} Owned</span>` : `<button class="btn sm" data-a="buy" data-x="${a.id}" ${S.fish < a.cost ? 'disabled' : ''}>Buy · ${a.cost} ${IC.fish}</button>`}</div>`).join('')}</div>`;
    }
    return `<section class="stack"><h1>Cats</h1>${tabs}${body}</section>`;
  }

  function vProgress() {
    const p = pos(), g = S.grade, all = Object.values(S.sub), tq = sum(all.map(x => x[1])), tc = sum(all.map(x => x[0]));
    const tiles = [[`${p.done ? 240 : p.m}<span class="small muted" style="font-size:.9rem"> / 240</span>`, 'Missions this grade'], [streakNow(), `Day streak (best ${S.best})`], [N(tq), 'Questions answered'], [tq ? pct(tc, tq) + '%' : '–', 'Right on first try'], [S.cats.length, 'Cats adopted'], [N(S.totalFish), 'Fish earned']];
    const meters = ['M', 'P', 'C', 'B', 'E'].map(k => { const s = S.sub[k] || [0, 0]; return `<div class="meter" title="${AREA[k]}: ${s[0]} of ${s[1]} right on the first try"><span>${AREA[k]}</span><div class="bar"><i style="width:${pct(s[0], s[1])}%"></i></div><span class="v">${s[1] ? pct(s[0], s[1]) + '% · ' + s[0] + '/' + s[1] : 'not started'}</span></div>`; }).join('');
    const now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7) - 21);
    let cal = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<i class="dow">${d}</i>`).join('');
    for (let i = 0; i < 28; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); const k = dstr(d), on = S.log[k] && S.log[k].m > 0; cal += `<i class="${on ? 'on' : ''} ${k === today() ? 'today' : ''}" title="${k}${S.log[k] ? ': ' + S.log[k].c + ' of ' + S.log[k].q + ' right' : ''}">${d.getDate()}</i>`; }
    const skills = skillsUpTo(p, true);
    const rows = skills.map((sk, i) => {
      const st = S.sk[sk[0] + sk[1]] || [0, 0], a = st[1] ? st[0] / st[1] : 0;
      const status = st[1] < 5 ? '<span class="status">New</span>' : a >= 0.8 ? `<span class="status good">${IC.check} Strong</span>` : a >= 0.6 ? '<span class="status">Getting there</span>' : `<span class="status bad">${IC.cross} Needs practice</span>`;
      return `<tr><td>${sk[2]}</td><td class="n">${st[1] ? pct(st[0], st[1]) + '%' : '–'}</td><td class="n">${st[0]}/${st[1]}</td><td>${status}</td><td class="n"><button class="btn alt sm" data-a="practice" data-i="${i}">Practise</button></td></tr>`;
    }).join('');
    return `<section class="stack"><div><h1>Progress</h1><p class="muted">For ${esc(S.name)} and for parents. Accuracy counts first tries only.</p></div>
      <div class="tiles">${tiles.map(t => `<div class="tile"><b>${t[0]}</b><span class="small muted">${t[1]}</span></div>`).join('')}</div>
      <div class="cols"><div class="panel stack"><h3>Accuracy by subject</h3>${meters}</div>
        <div class="panel stack"><h3>Mission days, last four weeks</h3><div class="cal">${cal}</div><span class="small muted">A filled day means at least one mission was finished.</span></div></div>
      <div class="panel stack"><h3>Maths skills so far</h3><p class="small muted">Practice rounds are 5 questions and pay a few fish. Weak skills also come back more often in daily missions.</p><div class="tscroll"><table class="sk"><thead><tr><th>Skill</th><th style="text-align:right">Accuracy</th><th style="text-align:right">Right</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="panel stack"><h3>Settings</h3>
        <div class="row"><label for="set-name" style="width:70px">Name</label><input class="text" id="set-name" maxlength="20" autocomplete="off" value="${esc(S.name)}" style="width:180px"><button class="btn alt sm" data-a="set-name">Save</button></div>
        <div class="row"><span style="width:70px">Grade</span><div class="chips">${[6, 7, 8].map(x => `<button class="chip" data-a="set-grade" data-g="${x}" aria-pressed="${g === x}">Grade ${x}</button>`).join('')}</div><span class="small muted">Each grade keeps its own place in the year.</span></div>
        <div class="row"><span style="width:70px">Sound</span><div class="chips"><button class="chip" data-a="sound" data-s="1" aria-pressed="${!!S.sound}">On</button><button class="chip" data-a="sound" data-s="0" aria-pressed="${!S.sound}">Off</button></div></div>
        <p class="small muted">${sync === 'cloud' ? 'Progress is saved to your Claude account, so it follows you to any device where you are signed in.' : 'Progress is saved in this browser only. Use the same browser each day.'}</p>
        <div class="row"><span style="width:70px">Player</span><span>${esc(S.name)}</span><button class="btn alt sm" data-a="switch">Switch or add player</button></div>
        <p class="small muted">This browser remembers ${P.list.length > 1 ? 'all ' + P.list.length + ' players' : 'you'}, so there is nothing to sign in to next time. Clearing the browser's history or site data, or using another device, starts fresh, so keep a backup code.</p>
        <div class="stack" style="gap:8px"><b style="font-family:var(--f-display)">Backup code</b>
          <div class="row"><button class="btn alt sm" data-a="backup">Copy my backup code</button><span class="small muted">Use it to move to a new device or browser.</span></div>
          ${UI.backup ? `<textarea class="text" id="bk-out" rows="3" readonly style="width:100%;font-size:.75rem;word-break:break-all">${UI.backup}</textarea>` : ''}
          <div class="row"><input class="text grow" id="bk-in" autocomplete="off" placeholder="Paste a backup code to restore" style="min-width:0"><button class="btn sm" data-a="restore">Restore</button></div></div>
        ${UI.confirmReset ? `<div class="confirm stack"><b>Delete ${esc(S.name)}'s progress, cats and fish?</b><span class="small">This cannot be undone.</span><div class="row"><button class="btn sm" data-a="reset-yes">Yes, delete everything</button><button class="btn alt sm" data-a="reset-no">Cancel</button></div></div>` : `<div><button class="link" data-a="reset">Reset all progress</button></div>`}
      </div></section>`;
  }

  const ownsItem = id => FREE_ITEMS.includes(id) || S.items.includes(id);
  const toysOut = () => S.show.filter(id => ITEM[id] && ITEM[id].cat === 'toy').length;
  function vRoom() {
    const r = S.room, placed = [r.wall, r.floor, r.view, r.poster, r.climb, r.bed, r.house, ...S.show].filter(Boolean);
    const cats = [catById(S.buddy), ...S.cats.filter(c => c.id !== S.buddy)].map(c => Object.assign({}, c, { name: esc(c.name) }));
    const n = toysOut(), td = today(), gain = Math.min(20, 4 * n);
    const cat = UI.rcat || 'house';
    const items = ITEMS.filter(i => i.cat === cat);
    const owned = ITEMS.filter(i => S.items.includes(i.id)).length;
    const cards = items.map(it => {
      const own = ownsItem(it.id), single = SINGLE[it.cat], using = single ? r[it.cat] === it.id : S.show.includes(it.id);
      let btn;
      if (!own) btn = `<button class="btn sm" data-a="rbuy" data-x="${it.id}" ${S.fish < it.cost ? 'disabled' : ''}>Buy ${it.cost} ${IC.fish}</button>`;
      else if (using) btn = (single && ['wall', 'floor', 'view'].includes(it.cat)) ? `<span class="status good">${IC.check} In use</span>` : `<button class="btn alt sm" data-a="ruse" data-x="${it.id}">Put away</button>`;
      else btn = `<button class="btn alt sm" data-a="ruse" data-x="${it.id}">${single ? 'Use' : 'Place'}</button>`;
      return `<div class="ccard">${itemPreview(it)}<b>${it.name}</b>${own && !using ? '<span class="small muted">Owned</span>' : ''}${btn}</div>`;
    }).join('');
    return `<section class="stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Cat room</h1><p class="muted">All ${S.cats.length} of your cats live here. Tap a cat to visit it.</p></div><span class="small muted">${owned} of ${ITEMS.length - FREE_ITEMS.length} things bought</span></div>
      ${has3D() ? '<div class="room3d"><canvas aria-label="Your cat room in 3D. Drag to turn it, tap a cat to visit it."></canvas><div class="r3tip" hidden></div><span class="r3hint">Drag to turn the room · tap a cat</span></div>' : roomSVG(r, placed, cats, { happy: S.playDay === td })}
      <div class="panel row playrow"><div class="grow stack" style="gap:2px"><b style="font-family:var(--f-display)">Play time</b><span class="small muted">${n ? `Once a day, every cat gets +${gain} growth from the ${n} toy${n > 1 ? 's' : ''} in the room (+4 per toy, up to 20).` : 'Put a toy in the room to unlock daily play time. Each toy gives every cat +4 growth.'}</span></div>
        <button class="btn sun" data-a="play" ${!n || S.playDay === td ? 'disabled' : ''}>${S.playDay === td ? 'Played today' : 'Play with the cats'}</button></div>
      <div class="chips" role="tablist">${ROOM_CATS.map(c => `<button class="chip" role="tab" data-a="rcat" data-t="${c[0]}" aria-pressed="${cat === c[0]}">${c[1]}</button>`).join('')}</div>
      <div class="catgrid">${cards}</div></section>`;
  }
  function render() {
    if (!S) { root.innerHTML = (P.list.length && !UI.newPlayer) ? vWho() : vOnboard(); return; }
    const focus = view === 'mission' || view === 'game';
    const body = { room: vRoom, home: vHome, play: vPlay, cats: vCats, progress: vProgress, mission: vMission, done: vDone, game: vGame, gameover: vGameOver }[view]();
    root.innerHTML = header() + (focus ? '' : nav()) + body;
    if (view === 'room') {
      const r = S.room, placed = [r.wall, r.floor, r.view, r.poster, r.climb, r.bed, r.house, ...S.show].filter(Boolean);
      const cats = [catById(S.buddy), ...S.cats.filter(c => c.id !== S.buddy)];
      const happy = S.playDay === today(), box = root.querySelector('.room3d');
      const flat = () => { const named = cats.map(c => Object.assign({}, c, { name: esc(c.name) })); const b2 = root.querySelector('.room3d'); if (b2) b2.outerHTML = roomSVG(r, placed, named, { happy }); startRoomMotion(root.querySelector('svg.room'), cats, placed, happy); };
      if (box) startRoom3D(box, { room: r, placed, cats, happy, onCat: id => { UI.sel = id; UI.catsTab = 'mine'; go('cats'); }, fallback: flat });
      else startRoomMotion(root.querySelector('svg.room'), cats, placed, happy);
    } else { stopRoomMotion(); stopRoom3D(); }
    if (view === 'mission') {
      const el = document.getElementById(M.done ? 'nextbtn' : 'ans');
      if (el) { try { el.focus({ preventScroll: !M.done }); } catch (e) { el.focus(); } if (el.id === 'ans') { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) { /* ignore */ } } }
    }
  }
  function go(v) { clearInterval(timer); if (v !== 'cats') UI.happy = null; UI.confirmReset = false; view = v; render(); window.scrollTo(0, 0); }

  /* ---------- actions ---------- */
  const ACT = {
    go: d => go(d.v),
    brand: () => { if (view === 'mission') { UI.quitAsk = true; render(); } else go('home'); },
    'ob-grade': d => { UI.ob.grade = +d.g; render(); },
    'ob-breed': d => { UI.ob.breed = d.b; render(); },
    'ob-start': () => {
      const o = UI.ob, name = o.name.trim();
      if (!name) { toast('Type your name first'); const el = document.getElementById('ob-name'); if (el) el.focus(); return; }
      const pid = P.list.some(x => x.id === 'p1') ? 'p' + Date.now().toString(36) : 'p1';
      P.list.push({ id: pid, name }); P.active = pid; saveProfiles(); UI.newPlayer = false;
      S = blank(); S.name = name; S.grade = o.grade;
      adopt(o.breed, true, o.cat.trim() || 'Mochi');
      view = 'home'; save(true); render(); if (pid !== 'p1' || !cloud) initCloud();
    },
    start: () => { if (missionsToday() < 2) startMission('daily'); },
    practice: d => { const sk = skillsUpTo(pos(), true)[+d.i]; if (sk) startMission('practice', sk); },
    pick: d => answer(+d.i),
    key: d => {
      if (!M || M.done) return;
      const el = document.getElementById('ans');
      if (d.k === 'go') return answer(el ? el.value : M.input);
      if (d.k === 'del') M.input = (el ? el.value : M.input).slice(0, -1); else M.input = (el ? el.value : M.input) + d.k;
      if (el) { el.value = M.input; el.focus({ preventScroll: true }); }
    },
    next: () => nextQ(),
    quit: () => { UI.quitAsk = true; render(); },
    'quit-no': () => { UI.quitAsk = false; render(); },
    'quit-yes': () => { M = null; UI.quitAsk = false; save(false); go('home'); },
    game: d => startGame(d.g),
    dash: d => {
      if (!GM || GM.id !== 'dash' || GM.wrong >= 0) return;
      GM.n++;
      if (+d.i === GM.q.ci) { GM.score++; beep('tap'); dashNext(); render(); }
      else { GM.wrong = +d.i; beep('bad'); render(); setTimeout(() => { if (GM && GM.id === 'dash' && view === 'game') { dashNext(); render(); } }, 700); }
    },
    flip: d => {
      const i = +d.i, c = GM.cards[i];
      if (GM.lock || c.up || c.done) return;
      c.up = true; GM.open.push(i);
      if (GM.open.length === 2) {
        GM.moves++;
        const [a, b] = GM.open.map(j => GM.cards[j]);
        if (a.k === b.k) { a.done = b.done = true; GM.open = []; GM.found++; beep('ok'); if (GM.found === GM.pairs) { render(); return setTimeout(() => { if (GM && GM.id === 'match' && view === 'game') endGame(Math.max(20, 62 - 3 * (GM.moves - GM.pairs)), GM.moves); }, 700); } }
        else { GM.lock = true; setTimeout(() => { if (!GM || GM.id !== 'match') return; a.up = b.up = false; GM.open = []; GM.lock = false; if (view === 'game') render(); }, 1100); }
      }
      render();
    },
    box: d => {
      const i = +d.i, it = GM.items[i];
      if (it.done || GM.wait) return;
      if (it.rank === GM.next) {
        it.done = true; GM.next++; beep('tap');
        if (GM.next === GM.items.length) {
          GM.pts += Math.max(2, 12 - 3 * GM.rm); GM.round++; GM.wait = true; render();
          return setTimeout(() => { if (!GM || GM.id !== 'stack' || view !== 'game') return; GM.wait = false; if (GM.round >= GM.rounds) endGame(GM.pts, GM.pts); else { stackRound(); render(); } }, 800);
        }
      } else { GM.rm++; GM.mist++; GM.shake = i; beep('bad'); setTimeout(() => { if (GM && GM.id === 'stack' && view === 'game' && GM.shake === i) { GM.shake = -1; render(); } }, 380); }
      render();
    },
    bucket: d => {
      if (GM.fb) return;
      const it = GM.items[GM.i], ok = d.s === it.side;
      it.ok = ok; if (ok) GM.score++;
      GM.fb = { ok, right: it.side === 'a' ? GM.set.a : GM.set.b }; beep(ok ? 'ok' : 'bad'); render();
      setTimeout(() => { if (!GM || GM.id !== 'sort' || view !== 'game') return; GM.fb = null; GM.i++; if (GM.i >= GM.items.length) endGame(GM.score * 5 + (GM.score === GM.items.length ? 10 : 0), GM.score); else render(); }, ok ? 650 : 1500);
    },
    ctab: d => { UI.catsTab = d.t; render(); },
    rcat: d => { UI.rcat = d.t; render(); },
    roomcat: d => { UI.sel = d.c; UI.catsTab = 'mine'; go('cats'); },
    rbuy: d => {
      const it = ITEM[d.x]; if (!it || ownsItem(it.id) || S.fish < it.cost) return;
      S.fish -= it.cost; S.items.push(it.id);
      if (SINGLE[it.cat]) S.room[it.cat] = it.id; else if (!S.show.includes(it.id)) S.show.push(it.id);
      beep('ok'); toast(`${it.name} added to the room`); save(true); render();
    },
    ruse: d => {
      const it = ITEM[d.x]; if (!it || !ownsItem(it.id)) return;
      if (SINGLE[it.cat]) S.room[it.cat] = S.room[it.cat] === it.id && !['wall', 'floor', 'view'].includes(it.cat) ? '' : it.id;
      else S.show = S.show.includes(it.id) ? S.show.filter(x => x !== it.id) : S.show.concat(it.id);
      save(true); render();
    },
    play: () => {
      const n = toysOut(), td = today(); if (!n || S.playDay === td) return;
      const gain = Math.min(20, 4 * n); let ups = 0;
      S.playDay = td; S.cats.forEach(c => { if (gainXp(c, gain)) ups++; });
      beep('win'); toast(ups ? `Play time! ${ups} cat${ups > 1 ? 's' : ''} levelled up` : `Play time! Every cat got +${gain} growth`); save(true); render();
    },
    selcat: d => { UI.sel = d.c; UI.happy = null; render(); window.scrollTo(0, 0); },
    feed: d => {
      const c = S.cats.find(x => x.id === UI.sel) || catById(S.buddy), f = FOODS.find(x => x.id === d.f);
      if (S.fish < f.cost || c.lvl >= MAXLVL) return;
      const st0 = stageOf(c.lvl); S.fish -= f.cost;
      const up = gainXp(c, f.xp); UI.happy = c.id;
      if (up) { beep('win'); toast(stageOf(c.lvl) !== st0 ? `${c.name} grew into a ${STAGES[stageOf(c.lvl)].toLowerCase()}!` : `${c.name} reached level ${c.lvl}!`); } else beep('tap');
      save(true); render();
    },
    pet: () => {
      const c = S.cats.find(x => x.id === UI.sel) || catById(S.buddy);
      if (c.pet === today()) return;
      c.pet = today(); const up = gainXp(c, 5); UI.happy = c.id; beep(up ? 'win' : 'ok');
      toast(up ? `${c.name} reached level ${c.lvl}!` : `${c.name} is purring`); save(true); render();
    },
    buddy: () => { const c = S.cats.find(x => x.id === UI.sel); if (c) { S.buddy = c.id; save(true); render(); } },
    wear: d => { const c = S.cats.find(x => x.id === UI.sel) || catById(S.buddy); c.acc = d.x; save(true); render(); },
    rename: () => { const c = S.cats.find(x => x.id === UI.sel) || catById(S.buddy), el = document.getElementById('rename'), v = el ? el.value.trim() : ''; if (v) { c.name = v.slice(0, 16); save(true); render(); toast('Renamed'); } },
    adopt: d => { const c = adopt(d.b, false); if (c && c.id) { UI.sel = c.id; UI.catsTab = 'mine'; UI.happy = c.id; beep('win'); toast(`Welcome home, ${c.name}! You can rename your new kitten.`); save(true); render(); window.scrollTo(0, 0); } },
    buy: d => { const a = ACCS.find(x => x.id === d.x); if (!a || S.fish < a.cost || S.accs.includes(a.id)) return; S.fish -= a.cost; S.accs.push(a.id); const c = catById(S.buddy); c.acc = a.id; beep('ok'); toast(`${c.name} is now wearing the ${a.name.toLowerCase()}`); save(true); render(); },
    'set-name': () => { const el = document.getElementById('set-name'), v = el ? el.value.trim() : ''; if (v) { S.name = v.slice(0, 20); save(true); render(); toast('Saved'); } },
    'set-grade': d => { S.grade = +d.g; save(true); render(); toast(`Now working on grade ${S.grade}`); },
    sound: d => { S.sound = d.s === '1'; save(true); render(); if (S.sound) beep('ok'); },
    reset: () => { UI.confirmReset = true; render(); },
    'reset-no': () => { UI.confirmReset = false; render(); },
    'reset-yes': () => {
      const rev = (S.rev || 0) + 1; S = null; UI.confirmReset = false; UI.sel = null;
      try { localStorage.removeItem(keyFor(P.active)); } catch (e) { /* ignore */ }
      if (cloud) cloud.set({ json: 'null', rev, name: '', grade: 0 }).catch(() => {});
      P.list = P.list.filter(x => x.id !== P.active); P.active = null; saveProfiles(); cloud = null; sync = 'local';
      view = 'home'; render();
    },
    'who': d => { P.active = d.p; saveProfiles(); S = loadLocal(); cloud = null; sync = 'local'; UI.sel = null; view = 'home'; if (!S) { P.list = P.list.filter(x => x.id !== d.p); P.active = null; saveProfiles(); } render(); window.scrollTo(0, 0); initCloud(); },
    'who-new': () => { S = null; P.active = null; UI.ob = { name: '', grade: 6, breed: 'tabby', cat: R.p(KITTEN_NAMES) }; UI.newPlayer = true; saveProfiles(); render(); },
    'switch': () => { clearInterval(timer); M = null; GM = null; S = null; UI.newPlayer = false; render(); window.scrollTo(0, 0); },
    'backup': async () => {
      const code = await packSave(); UI.backup = code; render();
      try { await navigator.clipboard.writeText(code); toast('Backup code copied. Paste it somewhere safe, like an email to yourself.'); }
      catch (e) { const el = document.getElementById('bk-out'); if (el) { el.focus(); el.select(); } toast('Select the code and copy it'); }
    },
    'restore': async () => {
      const el = document.getElementById('bk-in'), v = el ? el.value.trim() : '';
      if (!v) return toast('Paste a backup code first');
      try { const s = await unpackSave(v); s.rev = Math.max(s.rev || 0, (S && S.rev) || 0) + 1; S = s; save(true); UI.backup = ''; view = 'home'; render(); toast(`Welcome back, ${S.name}! Your cats are home.`); }
      catch (e) { toast('That code did not work. Check you copied all of it.'); }
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.a];
    if (fn) fn(el.dataset, el);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.in) UI.ob[t.dataset.in] = t.value;
    if (t.id === 'ans' && M) M.input = t.value;
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.closest && e.target.closest('g[data-a]')) { e.target.closest('g[data-a]').dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (view !== 'mission' || !M || e.metaKey || e.ctrlKey || e.altKey) return;
    const q = M.qs[M.i];
    if (M.done) { if (e.key === 'Enter') { e.preventDefault(); nextQ(); } return; }
    if (q.kind === 'mc') { const i = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase()); if (i >= 0 && i < q.choices.length) { e.preventDefault(); answer(i); } }
    else if (e.key === 'Enter') { e.preventDefault(); const el = document.getElementById('ans'); answer(el ? el.value : M.input); }
  });

  function start() {
    P = loadProfiles();
    if (P.active && !P.list.some(x => x.id === P.active)) P.active = null;
    S = P.list.length > 1 ? null : (P.active || (P.list[0] && (P.active = P.list[0].id))) ? loadLocal() : null;
    if (P.list.length === 1 && !S) { P = { list: [], active: null }; }
    saveProfiles();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
    render(); if (S || !P.list.length) initCloud();
  }
  start();
})();
</script>
